name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build.sh

      - name: Package
        run: ditto -c -k --keepParent build/ScreenSense.app ScreenSense.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSense
          path: ScreenSense.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenSense.zip
          generate_release_notes: true
